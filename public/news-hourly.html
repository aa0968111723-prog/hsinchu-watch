<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>新竹新聞索引</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/civic-nav.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div>
        <h1>新竹新聞索引</h1>
        <p class="sub">公開來源最新一輪・不是已查核事實</p>
      </div>
    </div>
    <nav class="wrap nav" aria-label="主選單">
      <a href="/index.html">總覽</a>
      <a href="/compare.html">比較</a>
      <a href="/topics.html">議題</a>
      <a href="/polls.html">民調</a>
      <a href="/commentary.html">評論</a>
      <a href="/manual.html">手動收錄</a>
    </nav>
    <nav class="wrap civic-nav" aria-label="公共事務">
      <a href="/governance.html">地方治理</a>
      <a href="/civic.html#central">中央與法案</a>
      <a href="/maps.html">政策與工程地圖</a>
      <a href="/person.html">人物與任期</a>
      <a href="/commentary.html">網路聲音</a>
      <a href="/compare.html">候選人比較</a>
      <a href="/archive.html">完整資料</a>
      <a href="/news-hourly.html">新竹新聞索引</a>
      <a href="/civic.html#method">方法與來源</a>
      <a href="/asset-lab.html">美術庫</a>
    </nav>
  </header>
  <main class="wrap" id="main-content">
    <p id="status" class="muted">讀取中</p>
    <ol id="list"></ol>
  </main>
  <script>
  const status = document.querySelector("#status");
  const list = document.querySelector("#list");
  fetch("/data/news-intel/latest.json")
    .then((response) => {
      if (!response.ok) throw new Error(String(response.status));
      return response.json();
    })
    .then((data) => {
      const articles = Array.isArray(data.articles) ? data.articles.slice(0, 20) : [];
      const when = data.last_success_at || "未知";
      status.textContent = `成功時間 ${when}。顯示 ${articles.length} 篇。Gemini 未使用。這是單一來源索引，不是已查核事實。`;
      for (const article of articles) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = article.url;
        link.textContent = article.title || "未命名";
        const meta = document.createElement("div");
        meta.className = "muted";
        meta.textContent = `${article.source_name || "來源未標"} · ${article.published_at || "日期未知"} · ${article.verification_status || "UNVERIFIED"}`;
        item.append(link, meta);
        list.append(item);
      }
      if (!articles.length) status.textContent = "這一輪沒有可顯示的文章，沒有補假資料。";
    })
    .catch(() => {
      status.textContent = "新聞索引讀取失敗。頁面沒有改用假資料。";
    });
  </script>
  <script defer src="/civic-nav.js"></script>
</body>
</html>
