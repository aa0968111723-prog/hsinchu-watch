<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>新竹新聞索引</title>
<style>
  body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f7f4ec; color: #1d1a16; }
  main { max-width: 46rem; margin: 0 auto; padding: 1rem; }
  a { color: #0b4f8a; }
  button { min-height: 44px; margin: 0 .4rem .4rem 0; padding: .4rem .8rem; font: inherit; }
  li { margin: 0 0 .9rem; }
  .meta { color: #5c564e; font-size: .92rem; }
</style>
</head>
<body>
<main>
  <p class="meta"><a href="/">回到新竹選情觀察</a></p>
  <h1>新竹新聞索引</h1>
  <p id="status" class="meta">讀取中</p>
  <p id="changes" class="meta"></p>
  <p>
    <button type="button" data-region="" aria-pressed="true">全部</button>
    <button type="button" data-region="hsinchu-city" aria-pressed="false">新竹市</button>
    <button type="button" data-region="hsinchu-county" aria-pressed="false">新竹縣</button>
  </p>
  <p id="filter-status" class="meta"></p>
  <ol id="list"></ol>
  <h2>新竹縣歲出決算</h2>
  <p id="account-status" class="meta"></p>
  <ol id="accounts"></ol>
  <h2>新竹縣現住人口</h2>
  <p id="population-status" class="meta"></p>
  <ol id="population"></ol>
  <h2>新竹縣路外停車場</h2>
  <p id="parking-status" class="meta"></p>
  <h2>新竹縣國小學區</h2>
  <p id="school-status" class="meta"></p>
  <h2>新竹縣觀光遊憩人次</h2>
  <p id="visitor-status" class="meta"></p>
  <ol id="visitors"></ol>
  <h2>新竹縣醫院急性一般病床</h2>
  <p id="bed-status" class="meta"></p>
  <ol id="beds"></ol>
  <h2>新竹縣選舉委員會公告</h2>
  <p id="election-status" class="meta"></p>
  <ol id="election-files"></ol>
  <h2>新竹縣議會公告</h2>
  <p id="notice-status" class="meta"></p>
  <ol id="notices"></ol>
  <h2>新竹市資料開放目錄</h2>
  <p id="catalog-status" class="meta"></p>
</main>
<script>
function regionGroup(id) {
  const text = String(id || "");
  const countyTowns = ["zhubei", "zhudong", "hukou", "xinfeng", "xinpu", "guanxi", "qionglin", "baoshan", "beipu", "emei", "hengshan", "jianshi", "wufeng"];
  if (text.startsWith("hsinchu-city")) return "hsinchu-city";
  if (text.startsWith("hsinchu-county") || countyTowns.includes(text)) return "hsinchu-county";
  return "";
}
function placeLabel(id) {
  const labels = {
    "hsinchu-city": "新竹市",
    "hsinchu-city-east": "新竹市東區",
    "hsinchu-city-north": "新竹市北區",
    "hsinchu-city-xiangshan": "新竹市香山",
    "hsinchu-county": "新竹縣",
    zhubei: "新竹縣竹北",
    zhudong: "新竹縣竹東",
    hukou: "新竹縣湖口",
    xinfeng: "新竹縣新豐",
    xinpu: "新竹縣新埔",
    guanxi: "新竹縣關西",
    qionglin: "新竹縣芎林",
    baoshan: "新竹縣寶山",
    beipu: "新竹縣北埔",
    emei: "新竹縣峨眉",
    hengshan: "新竹縣橫山",
    jianshi: "新竹縣尖石",
    wufeng: "新竹縣五峰",
  };
  return labels[id] || (regionGroup(id) === "hsinchu-city" ? "新竹市" : regionGroup(id) === "hsinchu-county" ? "新竹縣" : "地區未標");
}
function taipeiStamp(value) {
  const text = String(value || "").trim();
  if (!text) return "";
  if (/^\d{4}$/.test(text) || /^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
  const parsed = Date.parse(text);
  if (Number.isNaN(parsed)) return text;
  const formatted = new Intl.DateTimeFormat("sv-SE", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23",
  }).format(new Date(parsed));
  return `${formatted} 臺北時間`;
}
const status = document.querySelector("#status");
const changes = document.querySelector("#changes");
const filterStatus = document.querySelector("#filter-status");
const list = document.querySelector("#list");
const accountStatus = document.querySelector("#account-status");
const populationList = document.querySelector("#population");
const populationStatus = document.querySelector("#population-status");
const parkingStatus = document.querySelector("#parking-status");
const schoolStatus = document.querySelector("#school-status");
const visitorStatus = document.querySelector("#visitor-status");
const visitors = document.querySelector("#visitors");
const electionStatus = document.querySelector("#election-status");
const electionFiles = document.querySelector("#election-files");
const bedStatus = document.querySelector("#bed-status");
const bedList = document.querySelector("#beds");
const accounts = document.querySelector("#accounts");
const noticeStatus = document.querySelector("#notice-status");
const notices = document.querySelector("#notices");
const catalogStatus = document.querySelector("#catalog-status");

function addItem(parent, title, url, meta, group, related) {
  const item = document.createElement("li");
  if (group) item.dataset.group = group;
  const link = document.createElement("a");
  link.href = url;
  link.textContent = title || "未命名";
  const note = document.createElement("div");
  note.className = "meta";
  note.textContent = meta;
  item.append(link, note);
  const links = (related || []).filter((href) => String(href).startsWith("https://"));
  if (links.length) {
    const extra = document.createElement("div");
    extra.className = "meta";
    extra.append("相關報導");
    for (const href of links) {
      let host = "";
      try {
        host = new URL(href).host.replace(/^www\./, "");
      } catch {
        continue;
      }
      const rel = document.createElement("a");
      rel.href = href;
      rel.textContent = host;
      extra.append(" ", rel);
    }
    item.append(extra);
  }
  parent.append(item);
}
fetch("/data/news-intel/latest.json")
  .then((response) => {
    if (!response.ok) throw new Error(String(response.status));
    return response.json();
  })
  .then((data) => {
    const articles = Array.isArray(data.articles) ? data.articles.slice(0, 20) : [];
    const when = taipeiStamp(data.last_success_at) || "未知";
    const geminiNote = data.gemini?.called ? "Gemini 有提出候選，尚未當事實。" : "Gemini 未使用。";
    let roundNote = "";
    if (Number.isFinite(data.duration_ms) && data.duration_ms >= 0) roundNote += `本輪抓取 ${Math.round(data.duration_ms / 1000)} 秒。`;
    if (Array.isArray(data.failures) && data.failures.length) {
      const failureNames = {
        "hsinchu-city-news": "新竹市政府列表",
        "hsinchu-county-news": "新竹縣政府",
        "cna-atom": "中央社",
        "hsinchu-county-council": "新竹縣議會",
        "hsc-expenditure-final": "歲出決算",
      };
      const names = data.failures.map((failure) => failureNames[failure.id] || "未命名來源");
      roundNote += `${names.join("、")}沒有讀到新文章。`;
    }
    status.textContent = articles.length
      ? `成功時間 ${when}。顯示 ${articles.length} 篇。${geminiNote}這是單一來源索引，不是已查核事實。${roundNote}`
      : `這一輪沒有可顯示的文章，沒有補假資料。${roundNote}`;
    const diff = data.changes;
    if (diff && Array.isArray(diff.added) && Array.isArray(diff.removed)) {
      changes.textContent = diff.added.length || diff.removed.length
        ? `和上一輪相比，新進 ${diff.added.length} 篇，退出 ${diff.removed.length} 篇。`
        : "和上一輪相比，清單沒有增減。";
    }
    for (const article of articles) {
      const claimLabels = { candidate_statement: "候選人說法", poll: "民調", legal_status: "司法程序", commentary: "評論", official_notice: "官方公告", news_report: "新聞報導", project_progress: "工程進度說法" };
      const statusLabels = { SINGLE_SOURCE: "單一來源", UNVERIFIED: "尚未查證", VERIFIED_OFFICIAL: "官方已核對", VERIFIED_MULTI_SOURCE: "多來源已核對", DISPUTED: "說法衝突", CORRECTED: "已更正", RETRACTED: "已撤下" };
      const pageTime = taipeiStamp(article.page_published_at) || "未讀到";
      const dateNote = article.date_checked === false
        ? ` · 原文時間 ${pageTime}`
        : article.feed_time_kind === "updated" && article.page_published_at
          ? ` · 清單是更新時間，原文時間 ${pageTime}`
          : article.date_checked === true ? " · 發布時間已對過原文" : "";
      const group = regionGroup(article.region_id);
      const place = placeLabel(article.region_id);
      addItem(list, article.title, article.url, `${place} · ${article.source_name || "來源未標"} · ${taipeiStamp(article.published_at) || "日期未知"} · ${claimLabels[article.claim_kind] || "未分類"} · ${statusLabels[article.verification_status] || "尚未查證"}${dateNote}`, group, article.related_urls);
    }
    const records = Array.isArray(data.public_records) ? data.public_records : [];
    accountStatus.textContent = records.length ? "金額沿用資料檔原文。單位未標示，不換算。這不是驗收或實支。" : "這一輪沒有決算數字，沒有補 0。";
    for (const record of records) {
      const amount = record.spent_amount === null || record.spent_amount === undefined || record.spent_amount === "" ? "欄位是空的" : record.spent_amount;
      addItem(accounts, `${record.year} 年度歲出決算`, record.list_url, `${record.source_name || "新竹縣政府"} · ${amount}`);
    }
    const people = data.population;
    const rows = Array.isArray(people?.rows) ? people.rows : [];
    const periodNote = people?.period_text ? `資料期間沿用來源描述 ${people.period_text}。` : "來源頁沒有寫年月。";
    populationStatus.textContent = rows.length
      ? `${periodNote}只列性別為「計」的總計，不另算年齡組。縣合計那列的區域別，資料檔寫的是 D-。`
      : "這一輪沒有人口數，沒有補 0。";
    if (people?.source_url && rows.length) {
      const source = document.createElement("a");
      source.href = people.source_url;
      source.textContent = "資料集頁";
      populationStatus.append(" ", source);
    }
    for (const row of rows) {
      const label = row.area_label === "D-" && row.area_code === "10004000" ? "縣合計（資料檔區域別為 D-）" : row.area_label;
      const total = row.total === null || row.total === undefined || row.total === "" ? "欄位是空的" : row.total;
      addItem(populationList, label, people.source_url, `${row.area_code} · ${total}`);
    }
    const parking = data.parking;
    parkingStatus.textContent = parking?.count
      ? `${parking.count} 處。只留名稱、行政區、地址、型式、格數原文和收費方式，不含電話。`
      : "這一輪沒有停車場資料，沒有補 0。";
    if (parking?.download_url) {
      const download = document.createElement("a");
      download.href = parking.download_url;
      download.textContent = "下載名冊";
      parkingStatus.append(" ", download);
    }
    if (parking?.source_url) {
      const source = document.createElement("a");
      source.href = parking.source_url;
      source.textContent = "資料集頁";
      parkingStatus.append(" ", source);
    }
    const schools = data.schools;
    const schoolPeriod = schools?.period_text ? `資料期間沿用來源描述 ${schools.period_text}。` : "來源頁沒有寫年度。";
    schoolStatus.textContent = schools?.count
      ? `${schoolPeriod}${schools.count} 所。只留學校名稱、鄉鎮市和學區原文。`
      : "這一輪沒有學區資料，沒有補名單。";
    if (schools?.download_url) {
      const download = document.createElement("a");
      download.href = schools.download_url;
      download.textContent = "下載學區";
      schoolStatus.append(" ", download);
    }
    if (schools?.source_url && schools?.count) {
      const source = document.createElement("a");
      source.href = schools.source_url;
      source.textContent = "資料集頁";
      schoolStatus.append(" ", source);
    }
    const visitorData = data.visitors;
    const visitorRows = Array.isArray(visitorData?.rows) ? visitorData.rows : [];
    const visitorPeriodText = visitorData?.period_text ? `資料期間沿用資料檔 ${visitorData.period_text}。` : "資料檔的年月不一致或沒有寫。";
    visitorStatus.textContent = visitorRows.length
      ? `${visitorPeriodText}人次、增減和成長率沿用原文，不另加總。`
      : "這一輪沒有遊憩人次，沒有補 0。";
    if (visitorData?.source_url && visitorRows.length) {
      const source = document.createElement("a");
      source.href = visitorData.source_url;
      source.textContent = "資料集頁";
      visitorStatus.append(" ", source);
    }
    for (const row of visitorRows) {
      const visits = row.visits === null || row.visits === undefined || row.visits === "" ? "人次未填" : row.visits;
      const change = row.change === null || row.change === undefined || row.change === "" ? "增減未填" : row.change;
      const when = row.roc_year && row.month ? `${row.roc_year}年${row.month}月` : "年月未填";
      addItem(visitors, row.name, visitorData.source_url, `${when} · 人次 ${visits} · 增減 ${change}`);
    }
    const bedData = data.beds;
    const bedRows = Array.isArray(bedData?.rows) ? bedData.rows : [];
    bedStatus.textContent = bedRows.length
      ? "只列急性一般病床的許可數和開放數，沿用原文。檔案寫 0 就顯示 0。其他床別不加總。"
      : "這一輪沒有病床數，沒有補 0。";
    if (bedData?.source_url && bedRows.length) {
      const source = document.createElement("a");
      source.href = bedData.source_url;
      source.textContent = "資料集頁";
      bedStatus.append(" ", source);
    }
    for (const row of bedRows) {
      const permitted = row.acute_general_permitted === null || row.acute_general_permitted === undefined || row.acute_general_permitted === "" ? "許可數未填" : row.acute_general_permitted;
      const open = row.acute_general_open === null || row.acute_general_open === undefined || row.acute_general_open === "" ? "開放數未填" : row.acute_general_open;
      addItem(bedList, row.name, bedData.source_url, `許可 ${permitted} · 開放 ${open}`);
    }
    const election = data.election;
    const electionFilesRows = Array.isArray(election?.files) ? election.files : [];
    electionStatus.textContent = election?.title
      ? "頁面沒有發布日期，不拿抓取時間充當。號次在附件，這裡不轉寫人名。"
      : "這一輪沒有選務公告，沒有補名單。";
    if (election?.source_url && election?.title) {
      const source = document.createElement("a");
      source.href = election.source_url;
      source.textContent = election.title;
      electionStatus.append(" ", source);
    }
    for (const file of electionFilesRows) {
      if (!String(file.url || "").startsWith("https://web.cec.gov.tw/")) continue;
      addItem(electionFiles, file.label || "附件", file.url, "附件");
    }
    const announcements = Array.isArray(data.announcements) ? data.announcements : [];
    noticeStatus.textContent = announcements.length ? `顯示 ${announcements.length} 則議會公告，日期沿用來源頁。` : "這一輪沒有議會公告，沒有補假資料。";
    for (const notice of announcements) {
      addItem(notices, notice.title, notice.url, `${notice.source_name || "新竹縣議會"} · ${taipeiStamp(notice.published_at) || "日期未知"}`);
    }
    const catalog = data.city_catalog;
    catalogStatus.textContent = catalog?.count
      ? `目錄 ${catalog.count} 筆。只留名稱、機關和格式，不含聯絡人。`
      : "這一輪沒有讀到市府目錄，沒有補假資料。";
    if (catalog?.download_url) {
      const download = document.createElement("a");
      download.href = catalog.download_url;
      download.textContent = "下載目錄";
      catalogStatus.append(" ", download);
    }
    if (catalog?.list_url) {
      const link = document.createElement("a");
      link.href = catalog.list_url;
      link.textContent = "新竹市政府資料開放平臺";
      catalogStatus.append(" ", link);
    }
    for (const button of document.querySelectorAll("[data-region]")) {
      button.addEventListener("click", () => {
        for (const other of document.querySelectorAll("[data-region]")) other.setAttribute("aria-pressed", String(other === button));
        const region = button.dataset.region;
        let shown = 0;
        for (const item of list.querySelectorAll("li")) {
          const match = !region || item.dataset.group === region;
          item.hidden = !match;
          if (match) shown += 1;
        }
        filterStatus.textContent = region ? `這個範圍 ${shown} 篇。` : "";
      });
    }
  })
  .catch(() => {
    status.textContent = "新聞索引讀取失敗。頁面沒有改用假資料。";
    accountStatus.textContent = "決算數字讀取失敗。頁面沒有改用假資料。";
    noticeStatus.textContent = "議會公告讀取失敗。頁面沒有改用假資料。";
    catalogStatus.textContent = "市府目錄讀取失敗。頁面沒有改用假資料。";
    populationStatus.textContent = "人口數讀取失敗。頁面沒有改用假資料。";
    parkingStatus.textContent = "停車場資料讀取失敗。頁面沒有改用假資料。";
    schoolStatus.textContent = "學區資料讀取失敗。頁面沒有改用假資料。";
    visitorStatus.textContent = "遊憩人次讀取失敗。頁面沒有改用假資料。";
    bedStatus.textContent = "病床數讀取失敗。頁面沒有改用假資料。";
    electionStatus.textContent = "選務公告讀取失敗。頁面沒有改用假資料。";
  });
</script>
</body>
</html>
