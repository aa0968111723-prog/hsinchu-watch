<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>新竹新聞索引</title>
<style>
  body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f7f4ec; color: #1d1a16; }
  main { max-width: 46rem; margin: 0 auto; padding: 1rem; }
  a { color: #0b4f8a; }
  li { margin: 0 0 .9rem; }
  .meta { color: #5c564e; font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>新竹新聞索引</h1>
  <p id="status" class="meta">讀取中</p>
  <ol id="list"></ol>
</main>
<script>
const status = document.querySelector("#status");
const list = document.querySelector("#list");
fetch("/data/news-intel/latest.json")
  .then((response) => {
    if (!response.ok) throw new Error(String(response.status));
    return response.json();
  })
  .then((data) => {
    const articles = Array.isArray(data.articles) ? data.articles.slice(0, 20) : [];
    const when = data.last_success_at || "未知";
    status.textContent = `成功時間 ${when}。顯示 ${articles.length} 篇。Gemini 未使用。這是單一來源索引，不是已查核事實。`;
    for (const article of articles) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = article.url;
      link.textContent = article.title || "未命名";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${article.source_name || "來源未標"} · ${article.published_at || "日期未知"} · ${article.verification_status || "UNVERIFIED"}`;
      item.append(link, meta);
      list.append(item);
    }
    if (!articles.length) status.textContent = "這一輪沒有可顯示的文章，沒有補假資料。";
  })
  .catch(() => {
    status.textContent = "新聞索引讀取失敗。頁面沒有改用假資料。";
  });
</script>
</body>
</html>
