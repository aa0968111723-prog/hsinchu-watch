<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>新竹新聞索引</title>
<style>
  body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f7f4ec; color: #1d1a16; }
  main { max-width: 46rem; margin: 0 auto; padding: 1rem; }
  a { color: #0b4f8a; }
  li { margin: 0 0 .9rem; }
  .meta { color: #5c564e; font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>新竹新聞索引</h1>
  <p id="status" class="meta">讀取中</p>
  <ol id="list"></ol>
  <h2>新竹縣議會公告</h2>
  <p id="notice-status" class="meta"></p>
  <ol id="notices"></ol>
</main>
<script>
const status = document.querySelector("#status");
const list = document.querySelector("#list");
const noticeStatus = document.querySelector("#notice-status");
const notices = document.querySelector("#notices");

function addItem(parent, title, url, meta) {
  const item = document.createElement("li");
  const link = document.createElement("a");
  link.href = url;
  link.textContent = title || "未命名";
  const note = document.createElement("div");
  note.className = "meta";
  note.textContent = meta;
  item.append(link, note);
  parent.append(item);
}
fetch("/data/news-intel/latest.json")
  .then((response) => {
    if (!response.ok) throw new Error(String(response.status));
    return response.json();
  })
  .then((data) => {
    const articles = Array.isArray(data.articles) ? data.articles.slice(0, 20) : [];
    const when = data.last_success_at || "未知";
    status.textContent = `成功時間 ${when}。顯示 ${articles.length} 篇。Gemini 未使用。這是單一來源索引，不是已查核事實。`;
    for (const article of articles) {
      const claimLabels = { candidate_statement: "候選人說法", poll: "民調", legal_status: "司法程序", commentary: "評論", official_notice: "官方公告", news_report: "新聞報導" };
      addItem(list, article.title, article.url, `${article.source_name || "來源未標"} · ${article.published_at || "日期未知"} · ${claimLabels[article.claim_kind] || "未分類"} · ${article.verification_status || "UNVERIFIED"}`);
    }
    const announcements = Array.isArray(data.announcements) ? data.announcements : [];
    noticeStatus.textContent = announcements.length ? `顯示 ${announcements.length} 則議會公告，日期沿用來源頁。` : "這一輪沒有議會公告，沒有補假資料。";
    for (const notice of announcements) {
      addItem(notices, notice.title, notice.url, `${notice.source_name || "新竹縣議會"} · ${notice.published_at || "日期未知"}`);
    }
    if (!articles.length) status.textContent = "這一輪沒有可顯示的文章，沒有補假資料。";
  })
  .catch(() => {
    status.textContent = "新聞索引讀取失敗。頁面沒有改用假資料。";
    noticeStatus.textContent = "議會公告讀取失敗。頁面沒有改用假資料。";
  });
</script>
</body>
</html>
