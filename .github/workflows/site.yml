name: Build and verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt
      - name: Check published data and source
        run: python tools/audit_publication.py
      - name: Verify snapshot recovery guards
        run: npm run test:release
      - name: Build complete site
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify mobile pages and interactions
        run: npm run test:browser
      - name: Save complete build and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: hsinchu-watch-${{ github.sha }}
          path: |
            dist/
            artifacts/
          retention-days: 14
