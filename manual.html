  <main class="wrap">
    <section class="panel submission" aria-labelledby="submission-heading">
      <header class="edition-heading">
        <h2 id="submission-heading">整理一則公開連結</h2>
        <p class="muted">交由維護者核對</p>
      </header>
      <ol>
        <li>找可公開閱讀的原始報導、影片或貼文連結。</li>
        <li>複製下方格式，填入人物、來源名稱和網址。有發布時間也可以附上。</li>
        <li>將整理好的內容交給維護者。</li>
      </ol>
      <label for="source-template"><strong>來源格式</strong></label>
      <textarea id="source-template" rows="5" readonly>人物
媒體或平台
原文網址
發布時間（選填）
補充說明（選填）</textarea>
      <div class="submission-actions">
        <button class="load-more" type="button" id="copy-source-template">複製格式</button>
        <p id="copy-source-status" class="muted" role="status"></p>
      </div>
    </section>
  </main>
